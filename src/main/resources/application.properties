spring.application.name=quanlisanbanh
server.port=${PORT:8080}
# Render chạy sau proxy HTTPS, dòng này giúp redirect đúng địa chỉ
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# KẾT NỐI DATABASE
# Không ghi mật khẩu vào file này (file này được đẩy lên GitHub).
#  - Trên Render: tạo 3 biến môi trường
#        SPRING_DATASOURCE_URL       = jdbc:postgresql://HOST:5432/TEN_DB
#        SPRING_DATASOURCE_USERNAME  = ...
#        SPRING_DATASOURCE_PASSWORD  = ...
#  - Trên máy bạn: copy local.properties.example thành local.properties
#    (file local.properties đã bị .gitignore nên không lên GitHub)
# ---------------------------------------------------------------
spring.config.import=optional:classpath:local.properties

# Flyway tạo/sửa bảng (thư mục db/migration), Hibernate chỉ kiểm tra cho khớp
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# ---------------------------------------------------------------
# TÀI KHOẢN CHỦ SÂN ĐẦU TIÊN (chỉ tạo khi bảng users đang trống)
# Nếu để trống mật khẩu, hệ thống tự sinh và in ra log đúng 1 lần.
# ---------------------------------------------------------------
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:}

# Giờ mở cửa / đóng cửa (hiển thị trên lưới lịch và dùng để kiểm tra giờ đặt)
app.lich.gio-mo-cua=5
app.lich.gio-dong-cua=23

# CHỈ đặt true MỘT LẦN khi muốn XÓA SẠCH database rồi tạo lại từ đầu. Xong phải gỡ ngay.
app.reset-db=${APP_RESET_DB:false}

# Không để lộ chi tiết lỗi ra trình duyệt
server.error.include-message=never
server.error.include-stacktrace=never
