<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body>
<div class="container">
    <div class="dang-nhap">
        <div class="text-center mb-3">
            <div style="font-size:2.5rem">⚽</div>
            <h1 class="h4">Quản lý sân bóng</h1>
            <p class="text-muted small mb-0">Hệ thống nội bộ cho chủ sân và nhân viên</p>
        </div>
        <div class="card card-body">
            <div class="alert alert-danger py-2" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu (hoặc tài khoản đã bị khóa).</div>
            <div class="alert alert-success py-2" th:if="${param.logout}">Bạn đã đăng xuất.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username"
                           autocapitalize="none" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Đăng nhập</button>
            </form>
        </div>
        <p class="text-center text-muted small mt-3">Chưa có tài khoản? Liên hệ chủ sân để được cấp.</p>
    </div>
</div>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
