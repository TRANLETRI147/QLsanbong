<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Quản lý sân bóng'">Quản lý sân bóng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<!-- ============ THANH MENU ============ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">⚽ Quản lý sân</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuChinh"
                aria-controls="menuChinh" aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuChinh" th:if="${me != null}">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" th:if="${laChu}"><a class="nav-link" th:href="@{/owner/dashboard}">Tổng quan</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/lich}">Lịch sân</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/booking/new}">+ Đặt sân</a></li>
                <li class="nav-item" th:if="${laChu}">
                    <a class="nav-link" th:href="@{/owner/cho-duyet}">Chờ duyệt
                        <span class="badge text-bg-warning" th:if="${soChoDuyet > 0}" th:text="${soChoDuyet}">0</span>
                    </a>
                </li>
                <li class="nav-item" th:if="${laChu}"><a class="nav-link" th:href="@{/owner/san}">Sân bóng</a></li>
                <li class="nav-item" th:if="${laChu}"><a class="nav-link" th:href="@{/owner/nhan-vien}">Nhân viên</a></li>
                <li class="nav-item" th:if="${laChu}"><a class="nav-link" th:href="@{/owner/thong-bao}">Thông báo</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 text-white flex-wrap">
                <!-- Quả chuông: tự tải lại mỗi 20 giây bằng HTMX -->
                <a th:if="${laChu}" th:href="@{/owner/thong-bao}" class="text-white text-decoration-none">
                    <span th:attr="hx-get=@{/owner/thong-bao/badge}" hx-trigger="load, every 20s" hx-swap="outerHTML">🔔</span>
                </a>
                <span class="small">
                    <span th:text="${me.fullName}">Tên</span>
                    (<span th:text="${me.role.nhan}">Vai trò</span>)
                </span>
                <a class="btn btn-sm btn-outline-light" th:href="@{/doi-mat-khau}">Đổi mật khẩu</a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-light">Đăng xuất</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- ============ QUẢ CHUÔNG (HTMX thay thế nguyên phần tử này) ============ -->
<span th:fragment="badge" th:attr="hx-get=@{/owner/thong-bao/badge}" hx-trigger="every 20s" hx-swap="outerHTML">🔔<span
        class="badge rounded-pill text-bg-danger ms-1" th:if="${chuaDoc > 0}" th:text="${chuaDoc}">0</span></span>

<!-- ============ THÔNG BÁO THÀNH CÔNG / LỖI ============ -->
<div th:fragment="flash">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${thongBao}">
        <span th:text="${thongBao}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${loi}">
        <span th:text="${loi}">Lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>

<!-- ============ TIỀN: 1500000 -> 1.500.000đ ============ -->
<span th:fragment="tien(v)" th:text="${#numbers.formatDecimal(v, 1, 'POINT', 0, 'COMMA')} + 'đ'">0đ</span>

<!-- ============ NHÃN TRẠNG THÁI ============ -->
<span th:fragment="trangThai(s)" class="badge" th:classappend="'text-bg-' + ${s.mau}" th:text="${s.nhan}">Trạng thái</span>

<!-- ============ SCRIPT CUỐI TRANG ============ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
