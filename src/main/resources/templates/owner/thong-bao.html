<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thông báo')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-3" style="max-width: 820px">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Thông báo</h1>
        <form th:action="@{/owner/thong-bao/doc-het}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Đánh dấu đã đọc hết</button>
        </form>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(ds)}">Chưa có thông báo nào.</p>

    <div class="list-group">
        <div class="list-group-item" th:each="n : ${ds}" th:classappend="${n.chuaDoc} ? 'list-group-item-warning'">
            <div class="d-flex justify-content-between gap-2">
                <div>
                    <span class="badge" th:classappend="'text-bg-' + ${n.type.mau}" th:text="${n.type.nhan}">Loại</span>
                    <span th:text="${n.message}">Nội dung</span>
                </div>
                <div class="text-end small text-muted nowrap" th:text="${#temporals.format(n.createdAt, 'dd/MM HH:mm')}">01/01 10:00</div>
            </div>
            <a class="small" th:if="${n.booking != null}" th:href="@{/booking/{id}(id=${n.booking.id})}">Mở booking #<span th:text="${n.booking.id}">1</span> ›</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
