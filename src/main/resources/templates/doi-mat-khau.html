<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-3" style="max-width: 480px">
    <div th:replace="~{fragments :: flash}"></div>
    <h1 class="h4 mb-3">Đổi mật khẩu</h1>
    <form th:action="@{/doi-mat-khau}" method="post" class="card card-body">
        <div class="mb-3">
            <label class="form-label" for="matKhauCu">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" id="matKhauCu" name="matKhauCu" autocomplete="current-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="matKhauMoi">Mật khẩu mới (ít nhất 6 ký tự)</label>
            <input type="password" class="form-control" id="matKhauMoi" name="matKhauMoi" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="nhapLai">Nhập lại mật khẩu mới</label>
            <input type="password" class="form-control" id="nhapLai" name="nhapLai" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-success">Lưu mật khẩu mới</button>
    </form>
</main>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
